<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEADWAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #f4e6c4; --dark: rgba(20, 14, 10, .72); --gold: #f0c440; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Pixelify Sans', monospace; color: var(--ink); user-select: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 0 #000, 0 0 4px #000; }
.phud { position: absolute; overflow: hidden; }
.phud + .phud { border-top: 3px solid #000; }
.cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #fff; box-shadow: 0 0 0 1px #000; }
.qline { position: absolute; top: 44px; left: 50%; transform: translateX(-50%); max-width: 70%; display: none; padding: 3px 12px; background: var(--dark); color: #f0d890; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.compass .qmark { position: absolute; top: 4px; transform: translateX(-50%); color: #ff5a3a; font-size: 16px; text-shadow: 0 0 3px #000; }
.compass { position: absolute; top: 10px; left: 50%; width: 420px; max-width: 70%; height: 30px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--dark) 15%, var(--dark) 85%, transparent); overflow: hidden; }
.compass span { position: absolute; top: 5px; transform: translateX(-50%); font-size: 16px; }
.compass .mj { font-weight: 700; color: #fff; } .compass .mn { font-size: 12px; top: 8px; opacity: .7; }
.compass .wind { color: #8fd8ff; font-size: 14px; top: 7px; } .compass .tick { top: 0; width: 2px; height: 6px; background: var(--gold); }
.gold { position: absolute; top: 14px; left: 18px; font-size: 18px; } .gold b { color: var(--gold); }
.boss { display: none; position: absolute; top: 50px; left: 50%; transform: translateX(-50%); width: 420px; max-width: 70%; text-align: center; }
.boss .bname { font-size: 15px; color: #9affc8; margin-bottom: 3px; } .boss .bbar { height: 10px; background: #111; border: 2px solid #000; } .boss .bfill { height: 100%; background: linear-gradient(#5adf9a, #1e8a5a); }
.hp { position: absolute; left: 18px; bottom: 20px; width: 220px; height: 14px; background: var(--dark); border: 2px solid #000; }
.hpfill { height: 100%; background: linear-gradient(#e85a4a, #a8281e); transition: width .2s; } .hpfill.low { animation: blink .6s infinite; }
@keyframes blink { 50% { opacity: .4; } }
.tools { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.slot { background: var(--dark); border: 2px solid #3a2a1a; padding: 4px 10px 4px 6px; font-size: 14px; white-space: nowrap; }
.slot i { font-style: normal; color: #aa9; margin-right: 6px; font-size: 11px; } .slot.on { border-color: var(--gold); color: #fff; }
.ship { position: absolute; right: 18px; bottom: 20px; width: 260px; background: var(--dark); border: 2px solid #3a2a1a; padding: 8px 10px; font-size: 13px; }
.ship .row { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin: 3px 0; } .ship .row.small { font-size: 12px; } .ship b { color: #fff; }
.ship .bar { flex: 1; height: 10px; background: #222; border: 1px solid #000; } .ship .fill.water { height: 100%; background: #3a8ac8; }
.ship .warn { color: #ff8a6a; animation: blink 1s infinite; font-size: 12px; } .ship .warn.fire { color: #ffb040; }
.prompt { position: absolute; top: 58%; left: 50%; transform: translateX(-50%); background: var(--dark); padding: 5px 12px; font-size: 16px; transition: opacity .15s; white-space: nowrap; }
.shelp { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: .9; background: var(--dark); padding: 4px 10px; white-space: nowrap; }
.toasts { position: absolute; top: 76px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; width: 90%; }
.toast { background: var(--dark); padding: 5px 14px; font-size: 16px; transition: opacity .8s, transform .8s; text-align: center; }
.toast.out { opacity: 0; transform: translateY(-8px); } .toast.bad { color: #ff9a7a; } .toast.good { color: var(--gold); } .toast.ghost { color: #7affc0; }
.place { position: absolute; top: 24%; left: 0; right: 0; text-align: center; font-size: 42px; font-weight: 700; letter-spacing: 2px; opacity: 0; color: #fff3d0; }
.place.show { animation: place 4.5s ease forwards; }
@keyframes place { 0% { opacity: 0; transform: translateY(10px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.under { position: absolute; inset: 0; background: rgba(10, 60, 90, .55); opacity: 0; transition: opacity .3s; }
.hurt { position: absolute; inset: 0; box-shadow: inset 0 0 120px 40px rgba(170, 0, 0, .8); opacity: 0; }
.vignette { position: absolute; inset: 0; box-shadow: inset 0 0 160px 60px rgba(10, 60, 30, .7); opacity: 0; transition: opacity 2s; }
.dead { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(40, 0, 0, .55); }
.dead h1 { font-size: 56px; margin: 0; color: #ffb0a0; }
.ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0, 0, 0, .55); }
.ov canvas { image-rendering: pixelated; border: 6px solid #6a4a2a; box-shadow: 0 10px 40px #000; max-width: 92%; max-height: 92%; aspect-ratio: 1; height: 80%; }
.tmap canvas { height: 62%; transform: rotate(-2deg); }
.riddle { margin-top: 14px; max-width: 70%; font-size: 20px; color: #f6e2b0; text-align: center; background: var(--dark); padding: 8px 14px; }
.riddle:empty { display: none; }
.cross.hit { animation: hitm .18s; } @keyframes hitm { 0% { background: #ff5040; transform: scale(3) rotate(45deg); } 100% { transform: scale(1); } }
.spy { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 0, transparent 36vmin, rgba(0,0,0,.92) 38vmin); }
.bars { position: absolute; inset: 0; width: 100%; height: 100%; }
.eship { display: none; position: absolute; left: 18px; top: 46px; width: 200px; background: rgba(20,14,10,.72); border: 2px solid #3a2a1a; padding: 5px 8px; font-size: 13px; }
.eship .bar { height: 8px; background: #222; border: 1px solid #000; margin: 3px 0; } .eship .fill { height: 100%; background: #3a8ac8; } .eship .small { font-size: 11px; opacity: .85; }
.windui { position: absolute; right: 16px; top: 10px; text-align: center; font-size: 12px; line-height: 1.25; }
.windui canvas { display: block; margin: 0 auto 2px; }
.wtxt { background: rgba(20,14,10,.72); padding: 2px 6px; }
.phud.small .windui { transform: scale(0.75); transform-origin: right top; }
.helmui { display: none; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); filter: drop-shadow(0 3px 0 #000); }
.phud.small .helmui { transform: translateY(-50%) scale(0.7); transform-origin: right center; }
.shop { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, .5); pointer-events: auto; }
.shop .panel { background: rgba(32, 22, 14, .96); border: 3px solid #6a4a2a; padding: 14px 18px; width: 560px; max-width: 94%; max-height: 92%; overflow: auto; }
.shop h2 { margin: 0; color: var(--gold); } .shop .hi { margin: 4px 0 8px; opacity: .85; } .shop .gold2 { margin-bottom: 8px; } .shop .gold2 b { color: var(--gold); }
.shop button { display: grid; grid-template-columns: 1fr auto; width: 100%; text-align: left; font-family: inherit; color: var(--ink); background: rgba(60, 40, 24, .8); border: 2px solid #4a3220; padding: 6px 10px; margin: 3px 0; cursor: pointer; font-size: 15px; }
.shop button .d { grid-column: 1 / 3; font-size: 12px; opacity: .75; } .shop button .pr { color: var(--gold); }
.shop button.sel { border-color: var(--gold); color: #fff; } .shop button.dis { opacity: .5; }
.shop .tip { font-size: 12px; opacity: .7; margin-top: 6px; }
.phud.small .compass { top: 4px; } .phud.small .place { font-size: 30px; } .phud.small .ship { width: 220px; font-size: 11px; } .phud.small .slot { padding: 2px 6px; font-size: 12px; }
.phud.small .toasts { top: 40px; } .phud.small .toast { font-size: 13px; } .phud.small .boss { top: 36px; }
#menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(0,0,0,.25), rgba(0,0,0,.8)); z-index: 5; }
#menu .panel { text-align: center; max-width: 680px; width: 92vw; max-height: 96vh; overflow: auto; }
#menu .logo { font-size: clamp(54px, 11vw, 112px); margin: 0; letter-spacing: 6px; color: #f6e2b0; text-shadow: 0 6px 0 #3a1a0a, 0 0 30px rgba(255, 200, 120, .35); }
#menu .sub { font-size: 20px; margin-top: -4px; color: #e8d0a0; } #menu .beta { margin: 6px 0 18px; color: #9ad0b8; font-size: 13px; letter-spacing: 2px; }
#menu h2 { font-size: 44px; margin: 0 0 14px; }
#menu button { font-family: inherit; font-size: 17px; color: var(--ink); background: rgba(40, 26, 16, .9); border: 2px solid #6a4a2a; padding: 8px 18px; margin: 4px; cursor: pointer; }
#menu button.sel { border-color: var(--gold); color: #fff; }
#menu > .panel > button { display: block; margin: 6px auto; min-width: 320px; }
#menu button.main { font-size: 26px; padding: 12px 40px; border-color: var(--gold); }
#menu button.slide { display: inline-flex; align-items: center; gap: 10px; }
#menu button.slide input { width: 120px; accent-color: #f0c040; cursor: pointer; }
#menu button.slide b { min-width: 42px; text-align: right; font-weight: normal; }
#menu .opts { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
#menu .help { margin-top: 14px; display: inline-block; text-align: left; background: rgba(20, 14, 10, .75); padding: 10px 16px; font-size: 14px; columns: 2; column-gap: 26px; }
#menu .help h3 { margin: 0 0 6px; font-size: 16px; color: var(--gold); break-after: avoid; }
#menu .help div { display: flex; gap: 10px; margin: 2px 0; break-inside: avoid; } #menu kbd { min-width: 96px; color: #fff; font-family: inherit; }
#menu .note { max-width: 520px; margin: 0 auto 12px; opacity: .85; }
#menu .join { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 10px 0; }
#menu input { font-family: inherit; font-size: 22px; width: 160px; text-align: center; letter-spacing: 4px; text-transform: uppercase; background: #1a120c; color: #fff; border: 2px solid #6a4a2a; padding: 6px; }
#menu .status { min-height: 24px; color: var(--gold); margin: 6px 0; } #menu .room { font-size: 20px; margin-bottom: 10px; } #menu .room b { color: var(--gold); letter-spacing: 3px; }
@media (max-width: 760px) { .ship { width: 200px; font-size: 11px; } .slot { padding: 3px 6px; font-size: 11px; } .compass { width: 260px; } #menu .help { columns: 1; } }
.fishbar{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:220px;display:none;font:12px monospace;color:#f0e8d0;text-shadow:1px 1px 0 #000;text-align:center}.fishbar .fb{height:7px;background:rgba(0,0,0,.5);margin-top:4px;border:1px solid #000}.fishbar .fb i{display:block;height:100%}
body.photo .phud,body.photo .hud,body.photo #hud{display:none!important}
.logbook{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,6,.55);z-index:30}
.logbook .panel{width:min(720px,94%);max-height:90%;overflow:auto;background:#e8d9b4;color:#2a1c10;border:4px solid #5a3a1a;padding:14px 18px;font:13px monospace;box-shadow:0 0 0 2px #2a1c10}
.logbook h2{margin:0 0 8px;font-size:20px}.logbook h3{margin:10px 0 4px;font-size:14px;border-bottom:1px solid #8a6a40}
.logbook .cols{display:flex;gap:18px;flex-wrap:wrap}.logbook .cols>div{flex:1;min-width:240px}.logbook td{padding:1px 8px 1px 0}.logbook td:last-child{text-align:right;font-weight:bold}
.logbook ul{list-style:none;padding:0;margin:0}.logbook .achs li{color:#8a7a60}.logbook .achs li.on{color:#2a1c10;font-weight:bold}.logbook .diary li{margin:2px 0}
.logbook .rbar{height:8px;background:#b8a078;border:1px solid #5a3a1a;margin:4px 0}.logbook .rbar i{display:block;height:100%;background:linear-gradient(90deg,#a03020,#c8a040,#40a050)}.logbook .hint{opacity:.7;margin-top:10px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="menu"></div>
<script src="game.js"></script>
</body>
</html>
